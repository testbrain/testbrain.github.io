<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JSON Formatter — Dev Tools</title>
    <link rel="stylesheet" href="../style.css" />
    <style>
        .editor-wrap { position: relative; margin-bottom: 16px; }

        #jsonInput {
            width: 100%;
            min-height: 340px;
            resize: vertical;
            background: var(--bg-soft);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
            font-size: 0.85rem;
            line-height: 1.5;
            padding: 16px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        #jsonInput:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.12); }
        #jsonInput::placeholder { color: var(--text-muted); }

        .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }

        .error-box {
            display: none;
            margin-top: 12px;
            padding: 12px 16px;
            border-radius: 8px;
            background: rgba(218, 54, 51, 0.1);
            border: 1px solid var(--red);
            color: #ffa198;
            font-size: 0.85rem;
            font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
        }

        .error-box.visible { display: block; }

        .hint { color: var(--text-muted); font-size: 0.8rem; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">

        <a class="back-link" href="../index.html">← Home</a>

        <header class="header">
            <h1>[ ] JSON Formatter</h1>
            <p class="subtitle">Paste raw JSON, then view it in a rich, collapsible tree</p>
        </header>

        <div class="editor-wrap">
            <textarea id="jsonInput" placeholder='Paste raw JSON here, e.g. {"name": "Alex", "active": true, "roles": ["admin", "user"]}'></textarea>
        </div>

        <div class="toolbar">
            <button class="btn btn-primary" id="formatBtn">✮⋆˙ Format &amp; View</button>
            <button class="btn" id="sampleBtn">⤷ Load Sample</button>
            <button class="btn" id="clearBtn">× Clear</button>
        </div>

        <div class="error-box" id="errorBox"></div>
        <p class="hint">Opens the formatted result in a new tab.</p>

        <footer class="footer">
            <p>Messy JSON in, readable JSON out.</p>
        </footer>

    </div>

    <div id="toast" class="toast"></div>

    <script src="json-formatter.js"></script>
</body>
</html>
